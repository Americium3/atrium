<!doctype html>
<html lang="en" data-theme="onyx" data-wing="salon" data-motion="full" data-entered="no">
<head>
<meta charset="utf-8">
<title>ATRIUM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Pre-paint: resolve theme, language, wing, motion and entrance suppression
   before first paint — no flash, no wrong-theme frame. */
(function () {
  var d = document.documentElement, ls;
  try { ls = window.localStorage; } catch (e) { ls = null; }
  var q = new URLSearchParams(location.search);   // debug overrides, not persisted
  function get(k, f) { return (ls && ls.getItem(k)) || f; }
  var pref = q.get('theme') || get('atrium.theme', 'system');
  var dark = pref === 'onyx' ||
    (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  d.dataset.theme = dark ? 'onyx' : 'ivory';
  d.dataset.themePref = pref;
  d.lang = (q.get('lang') || get('atrium.lang', 'en')) === 'zh' ? 'zh' : 'en';
  d.dataset.wing =
    (q.get('wing') || get('atrium.wing', 'salon')) === 'bureau' ? 'bureau' : 'salon';
  // Reader's optical correction, on top of the viewport's own step. Resolved
  // pre-paint like the theme: type that resizes after first paint reflows the
  // whole hall in front of the reader.
  var ui = q.get('ui') || get('atrium.ui', 'm');
  d.dataset.ui = (ui === 's' || ui === 'l') ? ui : 'm';
  var motion = q.get('motion') || get('atrium.motion',
    matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full');
  d.dataset.motion = motion;
  // The entrance plays on every load. It was previously gated by a 6 h
  // localStorage stamp (`atrium.entered`), which meant the hall's best moment
  // was something you saw once a morning and never again. Nothing reads or
  // writes that key any more. The escape hatches are unchanged and cover the
  // hurry case: reduced motion collapses it, ?entrance=0 skips it outright,
  // and any click or keypress cuts a running one short.
  var play = motion === 'full';
  if (q.get('entrance') === '1') play = true;
  if (q.get('entrance') === '0') play = false;
  d.dataset.entered = play ? 'no' : 'yes';
  // data-boot distinguishes a suppressed load (hall fades in at boot) from
  // a played entrance (flipping data-entered later must NOT re-fade).
  d.dataset.boot = play ? 'played' : 'suppressed';
})();
</script>

     browser takes the last <link rel=icon> it understands, so the SVG must

<script>
/* ?probe=1 - layout read-out for scripts/probe.py.
   A screenshot shows where a box ENDED UP; it cannot show how wide the box
   was allowed to be, and CSS cannot report what a clamp() resolved to. This
   writes the live boxes into document.title, which headless Chrome hands
   back through --dump-dom with no debugger attached. Debug-only, in the same
   spirit as the ?theme= and ?prefs=1 overrides above; it renders nothing. */
if (location.search.indexOf('probe=1') >= 0) setTimeout(function () {
  var out = [];
  ['#hall', '#concourse', '#stage', '#floorplane', '#works', '#bulletin',
   '#clock', '#gates', '.gate.active', '.gate.receded', '#signal-desk']
  .forEach(function (sel) {
    var e = document.querySelector(sel);
    if (!e) { out.push(sel + '=none'); return; }
    var r = e.getBoundingClientRect();
    out.push(sel + '=' + [r.left, r.top, r.width, r.height].map(Math.round).join(','));
  });
  out.push('ui=' +
    getComputedStyle(document.documentElement).getPropertyValue('--ui').trim());
  out.push('vp=' + innerWidth + 'x' + innerHeight);
  out.push('scrollH=' + document.documentElement.scrollHeight);
  document.title = out.join(' | ');
}, 2600);
</script>

</body>
</html>
